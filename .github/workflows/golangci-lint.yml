name: golangci-lint
on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: "*"

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        golang:
          - 1.18
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 1.18
      - uses: actions/checkout@v4
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=10m
